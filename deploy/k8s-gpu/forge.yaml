# The full loop on one NVIDIA GPU inside a pod: TRL LoRA training, vLLM serving, gate, promote, gateway.
apiVersion: forge.dev/v1alpha1
kind: Platform
metadata: { name: k8s-gpu }
spec:
  storage: { uri: /work/.forge }
  gateway: { port: 4000 }
---
apiVersion: forge.dev/v1alpha1
kind: Model
metadata: { name: router }
spec:
  base: qwen2.5-1.5b-instruct
  licence: Apache-2.0
  weights: Qwen/Qwen2.5-1.5B-Instruct
  serve:
    engine: vllm
    args: [--dtype, half, --max-model-len, "4096", --gpu-memory-utilization, "0.85"]   # T4: no bf16
  data:
    source: { jsonl: tickets.jsonl }
    minExamples: 300
  train:
    engine: trl
    recipe: sft
    overrides: { epochs: 2, max_seq_len: 512 }
  eval:
    splits: { heldOut: 0.1, audit: 0.05 }
    generation: { maxTokens: 16 }
    evaluators:
      - labels: { column: label }
    gate: { test: superiority, confidence: 0.95, minItems: 20 }
