apiVersion: v1
kind: Pod
metadata:
  name: ookami-gpu
  namespace: ookami-test
spec:
  restartPolicy: Never
  tolerations:
    - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
    - { key: kubernetes.azure.com/scalesetpriority, operator: Equal, value: spot, effect: NoSchedule }
  nodeSelector: { agentpool: gpuspot }
  containers:
    - name: ookami
      image: vllm/vllm-openai:latest
      command: ["/bin/bash", "/config/run.sh"]
      resources:
        limits: { nvidia.com/gpu: 1 }
      volumeMounts:
        - { name: config, mountPath: /config }
        - { name: wheel, mountPath: /wheel }
        - { name: work, mountPath: /work }
        - { name: shm, mountPath: /dev/shm }
  volumes:
    - { name: config, configMap: { name: ookami-gpu-config } }
    - { name: wheel, configMap: { name: ookami-wheel } }
    - { name: work, emptyDir: {} }
    - { name: shm, emptyDir: { medium: Memory, sizeLimit: 4Gi } }
