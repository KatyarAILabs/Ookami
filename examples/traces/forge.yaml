# Capture gateway traffic with Trajectory, then fine-tune on the episodes it scored as successful.
#   CC_HMAC_KEY=dev-key forge up        # collector + engine + gateway, wired together
#   ... send traffic with litellm_session_id, metadata.task_type, metadata.episode_end ...
#   cc outcomes / cc score              # label and reward episodes in Trajectory (see its docs/OUTCOMES.md)
#   forge train assistant               # trains on rewarded episodes only
apiVersion: forge.dev/v1alpha1
kind: Platform
metadata: { name: traces }
spec:
  storage: { uri: ./.forge }
  components: { tracing: { enabled: true } }
  tracing:
    mode: managed
    config: ./collector.yaml
    lake: ./lake
    bin: cc
---
apiVersion: forge.dev/v1alpha1
kind: Model
metadata: { name: assistant }
spec:
  base: qwen3-4b-instruct-2507
  data:
    source: { traces: { minReward: 1 } }
    minExamples: 200
  train: { recipe: sft }
  eval:
    splits: { heldOut: 0.1, audit: 0.05, stratifyBy: [task_type] }
    evaluators:
      - python: ./check.py:score
