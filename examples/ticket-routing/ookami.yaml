# Quickstart: fine-tune a small open model on one machine, gate it against the base, serve it.
#   python make_data.py > tickets.jsonl
#   ookami train router -f ookami.yaml      # snapshot -> LoRA -> gate vs base
#   ookami promote router -f ookami.yaml    # only if it passed
#   ookami up -f ookami.yaml                # serve the live version behind the gateway
apiVersion: ookami.dev/v1alpha1
kind: Platform
metadata: { name: quickstart }
spec:
  storage: { uri: ./.ookami }
---
apiVersion: ookami.dev/v1alpha1
kind: Model
metadata: { name: router }
spec:
  base: qwen3-4b-instruct-2507
  data:
    source: { jsonl: tickets.jsonl }
    minExamples: 300
  train:
    recipe: sft
    overrides: { epochs: 2 }
  eval:
    splits: { heldOut: 0.1, audit: 0.05 }
    generation: { maxTokens: 16 }
    evaluators:
      - labels: { column: label }
    gate: { test: superiority, confidence: 0.95, minItems: 20 }
