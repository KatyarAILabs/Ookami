# Gate a candidate with your own benchmark harness (any command that writes per-item scores).
#   ookami eval -f examples/benchmark.yaml --candidate openai:http://localhost:8000/v1#my-model \
#                                         --incumbent openai:http://localhost:8001/v1#base-model
apiVersion: ookami.dev/v1alpha1
kind: Platform
metadata: { name: bench }
spec:
  storage: { uri: ./.ookami }
---
apiVersion: ookami.dev/v1alpha1
kind: Model
metadata: { name: my-model }
spec:
  base: qwen3.5-4b
  eval:
    evaluators:
      - command: { run: "python bench/bench.py --base-url {base_url} --model {model} --out {output}" }
        name: toy-bench
    gate: { test: non-inferiority, margin: -0.05, minItems: 2 }
