<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;background:#000;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#fff;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#141414 1px,transparent 1px),linear-gradient(90deg,#141414 1px,transparent 1px);background-size:40px 40px;background-position:-1px -1px;
 -webkit-mask-image:radial-gradient(ellipse 80% 90% at 85% 40%,#000 0%,transparent 75%)}
.mark-bg{position:absolute;right:-40px;top:40px;width:520px;height:520px;opacity:.07}
.wrap{position:absolute;left:80px;top:72px;right:80px}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600;letter-spacing:-.01em}
.brand svg{width:40px;height:40px}
.tag{margin-left:10px;font:500 14px Menlo,monospace;color:#9a9a9a;border:1px solid #333;padding:5px 9px}
h1{margin-top:62px;font-size:66px;line-height:1.04;font-weight:650;letter-spacing:-.035em;max-width:900px}
h1 span{color:#7a7a7a}
p{margin-top:24px;font-size:22px;line-height:1.45;color:#a8a8a8;max-width:860px}
.flow{position:absolute;left:80px;right:80px;bottom:64px;display:flex;align-items:center}
.node{font:500 15px Menlo,monospace;color:#d8d8d8;border:1px solid #3a3a3a;background:#0a0a0a;padding:11px 16px;white-space:nowrap}
.node.hi{border-color:#fff;color:#fff}
.node .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3fb950;margin-right:9px;vertical-align:1px}
.node .dot.b{background:#388bfd}
.line{flex:1;height:1px;background:#3a3a3a;position:relative;min-width:18px}
.line:after{content:"";position:absolute;right:-1px;top:-4px;border:4px solid transparent;border-left:6px solid #5a5a5a;border-right:0}
</style></head><body>
<div class="grid"></div>
<svg class="mark-bg" viewBox="0 0 32 32"><path d="M7 25 L7 8 L12.5 13.5 L16 7 L19.5 13.5 L25 8 L25 25 L19.5 20.5 L16 25 L12.5 20.5 Z" fill="#fff"/></svg>
<div class="wrap">
 <div class="brand"><svg viewBox="0 0 32 32"><path d="M7 25 L7 8 L12.5 13.5 L16 7 L19.5 13.5 L25 8 L25 25 L19.5 20.5 L16 25 L12.5 20.5 Z" fill="#fff"/></svg>Ookami<span class="tag">open source · self-hosted</span></div>
 <h1>Your AI infrastructure,<br><span>in one package.</span></h1>
 <p>Gateway, model serving, fine-tuning, eval gates, registry, traces and GPU autoscaling. One install, one config file, on your own hardware.</p>
</div>
<div class="flow">
 <div class="node">your apps</div><div class="line"></div>
 <div class="node hi">gateway</div><div class="line"></div>
 <div class="node"><span class="dot"></span>engines</div><div class="line"></div>
 <div class="node">traces</div><div class="line"></div>
 <div class="node">fine-tune</div><div class="line"></div>
 <div class="node hi">eval gate</div><div class="line"></div>
 <div class="node"><span class="dot b"></span>promote</div>
</div>
</body></html>
