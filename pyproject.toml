[project]
name = "forge-ml"
version = "0.0.1"
description = "Packaged, self-hosted AI infrastructure: traffic in, gated fine-tuned models out."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
forge = "forge.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
