[project]
name = "forge-ml"
version = "0.2.0.dev0"
description = "Packaged, self-hosted AI infrastructure: traffic in, gated fine-tuned models out."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gateway = ["litellm[proxy]>=1.83,<2"]   # 1.82.7 and 1.82.8 on PyPI were backdoored (Mar 2026)
parquet = ["pyarrow>=15"]
hf = ["datasets>=3"]
train-cuda = ["trl>=0.20", "peft>=0.15", "transformers>=4.50", "datasets>=3", "bitsandbytes>=0.45", "torch"]

[project.scripts]
forge = "forge.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
